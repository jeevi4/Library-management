<div class="auth-container">
  <div class="auth-card">
    <h2>📚 Library Portal</h2>
    <h3>Login</h3>
    <div *ngIf="errorMessage" class="error">{{ errorMessage }}</div>
    <div class="form-group">
      <label>Email</label>
      <input type="email" [(ngModel)]="email" placeholder="Enter email"/>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" [(ngModel)]="password" placeholder="Enter password"/>
    </div>
    <button (click)="onLogin()" [disabled]="loading" class="btn-primary">
      {{ loading ? 'Logging in...' : 'Login' }}
    </button>
    <p class="link">Don't have an account? <a routerLink="/register">Register</a></p>
  </div>
</div>
